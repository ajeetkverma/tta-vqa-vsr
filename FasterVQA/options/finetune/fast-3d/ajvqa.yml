name: tta_otg_ajvqa
tta_epochs: 3
num_epochs: 1
l_num_epochs: 1
warmup_epochs: 1
ema: false
save_model: false
batch_size: 1
num_workers: 1
split_seed: 42
need_feat: true
need_upsampled: true

data:
    val:
        type: FusionDataset
        args:
            phase: test
            anno_file: Dataset/VQADataset/val_labels.txt
            data_prefix: Dataset/VQADataset/val   
            # anno_file: Dataset/VQADataset/all_labels_1155.txt
            # data_prefix: Dataset/VQADataset/all_data 
            sample_types:
                fragments:
                    fragments_h: 7
                    fragments_w: 7
                    fsize_h: 32
                    fsize_w: 32
                    aligned: 4
                    clip_len: 32
                    frame_interval: 2
                    t_frag: 8
                    num_clips: 1


model:
    type: DiViDeAddEvaluator
    args:
        backbone:
            fragments:
                checkpoint: false
                pretrained: 
        backbone_size: swin_tiny_grpb
        backbone_preserve_keys: fragments
        divide_head: false
        vqa_head:
            in_channels: 768
            hidden_channels: 64
            
optimizer:
    lr: !!float 1e-3
    backbone_lr_mult: !!float 1e-1
    wd: 0.02
        
load_path: ./pretrained_weights/FAST_VQA_3D_1*1.pth

    
        
